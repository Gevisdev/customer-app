<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Customer Tracker</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #f1f5f9; color: #0f172a; }
    .modal-backdrop { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Login Screen for Admin -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center mx-auto mb-3 shadow-sm">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Owner Login</h1>
        <p class="text-sm text-slate-500 mt-1">Authorized access only</p>
      </div>
      <form id="authForm" class="space-y-4">
        <div>
          <input id="authEmail" type="email" required placeholder="Owner Email"
            class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-slate-800" />
        </div>
        <div>
          <input id="authPassword" type="password" required placeholder="Password"
            class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-slate-800" />
        </div>
        <div id="authError" class="hidden text-xs text-rose-600 bg-rose-50 p-2 rounded border border-rose-200"></div>
        <button type="submit" id="authSubmitBtn"
          class="w-full py-2.5 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 shadow-sm transition">
          Secure Login
        </button>
      </form>
    </div>
  </div>

  <!-- Main Admin App -->
  <div id="mainApp" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="shield" class="w-5 h-5 text-emerald-400"></i>
          <h1 class="text-lg font-bold">Owner Admin Panel</h1>
        </div>
        <button id="logoutBtn" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
      
      <!-- Settings Card -->
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2"><i data-lucide="settings" class="w-4 h-4"></i> App Settings (UPI & Limits)</h2>
        <form id="settingsForm" class="flex flex-col sm:flex-row gap-4 items-end">
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Your UPI ID</label>
            <input id="settingUpi" type="text" placeholder="yourname@upi" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Free Customer Limit</label>
            <input id="settingLimit" type="number" placeholder="5" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500" />
          </div>
          <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Save Settings</button>
        </form>
      </div>

      <!-- Pending Payments -->
      <div class="bg-white rounded-xl border border-amber-200 p-5 shadow-sm">
        <h2 class="text-sm font-bold text-amber-800 mb-4 flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4"></i> Pending Payments</h2>
        <div id="pendingList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <!-- All Users -->
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
        <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Registered Users</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-xs uppercase text-slate-500">
              <tr>
                <th class="px-3 py-2">Email</th>
                <th class="px-3 py-2">Plan</th>
                <th class="px-3 py-2">Expiry Date</th>
                <th class="px-3 py-2">Action</th>
              </tr>
            </thead>
            <tbody id="usersList" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full overflow-hidden">
      <div class="p-3 border-b flex justify-between bg-slate-50">
        <span class="font-bold text-sm">Payment Screenshot</span>
        <button onclick="document.getElementById('imageModal').classList.add('hidden')" class="text-slate-500 hover:text-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <img id="modalImage" src="" class="w-full h-auto max-h-[75vh] object-contain bg-slate-900" />
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://nnylgvvszfsnkevffdoi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueWxndnZzemZzbmtldmZmZG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1Mzk2OTYsImV4cCI6MjExMTExNTY5Nn0.ZmaPpZ-CGnlAnvmeEPpLGvz7N8Nw7WHSxReZfVtb7oI';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    lucide.createIcons();

    // --- AUTH ---
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      const btn = document.getElementById('authSubmitBtn');
      
      errEl.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Authenticating...';

      try {
        // 1. Login
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
        if (authError) throw new Error("Login Failed: " + authError.message);
        
        // 2. Fetch Profile
        const { data: profileData, error: profError } = await supabase.from('profiles').select('*').eq('id', authData.user.id).maybeSingle();
        
        if (profError) {
          throw new Error("DB Error: " + profError.message);
        }
        
        if (!profileData) {
          throw new Error("Profile not found in database for ID: " + authData.user.id);
        }

        if (profileData.role !== 'owner') {
          throw new Error("Your role is '" + profileData.role + "', not 'owner'.");
        }

        // Success
        currentUser = authData.user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        loadDashboard();
        
      } catch (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Secure Login';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.reload();
    });

    // --- DASHBOARD LOAD ---
    async function loadDashboard() {
      await loadSettings();
      await loadPendingPayments();
      await loadUsers();
    }

    async function loadSettings() {
      const { data } = await supabase.from('settings').select('*').eq('id', 1).single();
      if (data) {
        document.getElementById('settingUpi').value = data.upi_id || '';
        document.getElementById('settingLimit').value = data.free_customer_limit || 5;
      }
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const upi = document.getElementById('settingUpi').value;
      const limit = parseInt(document.getElementById('settingLimit').value);
      await supabase.from('settings').update({ upi_id: upi, free_customer_limit: limit }).eq('id', 1);
      alert('Settings saved! UPI will now show on the frontend.');
    });

    async function loadPendingPayments() {
      const { data, error } = await supabase.from('payments').select('*, profiles(email)').eq('status', 'pending');
      const list = document.getElementById('pendingList');
      
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="text-sm text-slate-500">No pending payments.</p>';
        return;
      }

      list.innerHTML = data.map(p => `
        <div class="border border-amber-200 bg-amber-50/50 rounded-lg p-3 space-y-2 text-sm">
          <div class="flex justify-between font-bold">
            <span class="truncate pr-2">${p.profiles?.email || 'Unknown User'}</span>
            <span class="text-emerald-700">₹${p.amount}</span>
          </div>
          <div class="text-xs text-slate-600">UTR: <span class="font-mono bg-white px-1 rounded border">${p.utr}</span></div>
          <div class="text-xs text-slate-600">Date: ${p.paid_on}</div>
          <button onclick="window.viewImage('${p.screenshot_url}')" class="text-xs font-semibold text-indigo-600 underline block">View Screenshot</button>
          <div class="flex gap-2 pt-2 border-t border-amber-200">
            <button onclick="window.approvePayment('${p.id}', '${p.user_id}')" class="flex-1 bg-emerald-600 text-white py-1.5 rounded text-xs font-bold">Approve</button>
            <button onclick="window.rejectPayment('${p.id}')" class="flex-1 bg-rose-100 text-rose-700 py-1.5 rounded text-xs font-bold">Reject</button>
          </div>
        </div>
      `).join('');
    }

    window.viewImage = (url) => {
      document.getElementById('modalImage').src = url;
      document.getElementById('imageModal').classList.remove('hidden');
    };

    window.approvePayment = async (paymentId, userId) => {
      if (!confirm('Approve this payment? User will get Premium for 30 days.')) return;
      
      const expiry = new Date();
      expiry.setDate(expiry.getDate() + 30);

      // 1. Update User Profile
      const { error: userErr } = await supabase.from('profiles').update({ 
        plan: 'premium', 
        premium_until: expiry.toISOString() 
      }).eq('id', userId);

      if (userErr) return alert('Error: ' + userErr.message);

      // 2. Update Payment Status
      await supabase.from('payments').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', paymentId);

      alert('Payment Approved! User is now Premium.');
      loadDashboard();
    };

    window.rejectPayment = async (paymentId) => {
      if (!confirm('Reject this payment?')) return;
      await supabase.from('payments').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', paymentId);
      alert('Payment Rejected.');
      loadDashboard();
    };

    async function loadUsers() {
      const { data, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('usersList');
      
      if (error || !data) return;

      list.innerHTML = data.map(u => {
        const isPremium = u.plan === 'premium';
        const expiry = u.premium_until ? new Date(u.premium_until).toLocaleDateString() : '-';
        return `
          <tr class="hover:bg-slate-50">
            <td class="px-3 py-2 font-medium">${u.email}</td>
            <td class="px-3 py-2">
              <span class="px-2 py-0.5 rounded text-xs font-bold ${isPremium ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                ${u.plan.toUpperCase()}
              </span>
            </td>
            <td class="px-3 py-2 text-xs">${isPremium ? expiry : '-'}</td>
            <td class="px-3 py-2">
              ${isPremium 
                ? `<button onclick="window.revokePremium('${u.id}')" class="text-xs text-rose-600 font-semibold hover:underline">Revoke</button>` 
                : `<span class="text-xs text-slate-400">-</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    window.revokePremium = async (userId) => {
      if (!confirm('Revoke premium from this user?')) return;
      await supabase.from('profiles').update({ plan: 'free', premium_until: null }).eq('id', userId);
      loadDashboard();
    };

  </script>
</body>
</html>
